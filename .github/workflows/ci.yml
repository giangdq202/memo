name: CI Check

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Build Application
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS Application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify signed app bundle
        run: |
          codesign --verify --deep --strict MeMo.app
          test -x MeMo.app/Contents/MacOS/MeMo

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh
